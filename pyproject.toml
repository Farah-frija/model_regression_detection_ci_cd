[project]
name = "model-regression-detection"
version = "0.1.0"
description = "CI-style regression detection for LLM-powered features"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
